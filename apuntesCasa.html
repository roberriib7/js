<html lang="en">

<head>
  <meta charset="UTF-8" />

<body>
  <button class="botonFiltro">Boton Filtrar</button>
  <input class="barra" type="text" placeholder="escribe el nombre" />
  <input class="bNumeros" type="text" placeholder="escribe el maximo">
  <input class="bMenor" type="text" placeholder="escribe el minimo">

  <button class="botonC1">Electrónica</button>
  <button class="botonC2">Accesorios</button>
  <button class="botonC3">Hogar</button>
  <button class="botonC4">Ropa</button>
  <div class="card"></div>

  <script>
    const productos = [
      {
        nombre: "Auriculares inalámbricos",
        precio: 49.99,
        descripcion: "Auriculares Bluetooth con cancelación de ruido.",
        categoria: "Electrónica",
      },
      {
        nombre: "Mochila urbana",
        precio: 35.5,
        descripcion: "Mochila resistente con compartimento para portátil.",
        categoria: "Accesorios",
      },
      {
        nombre: "Botella reutilizable",
        precio: 18.0,
        descripcion: "Botella de acero inoxidable de 750 ml.",
        categoria: "Hogar",
      },
      {
        nombre: "Lámpara de escritorio LED",
        precio: 27.99,
        descripcion: "Lámpara LED con intensidad regulable.",
        categoria: "Hogar",
      },
      {
        nombre: "Teclado inalámbrico",
        precio: 42.0,
        descripcion: "Teclado compacto con conexión Bluetooth.",
        categoria: "Electrónica",
      },
      {
        nombre: "Gorra deportiva",
        precio: 16.5,
        descripcion: "Gorra ligera para actividades al aire libre.",
        categoria: "Ropa",
      },
    ];
    //filtre un array de products y lo rendereza, una funcion paar filtar y orta para renderizar, que sea menor a 100 euros

    const botonFiltro = document.querySelector(".botonFiltro");

    const padre = document.querySelector(".card");

    function renderizar(array) {
      padre.innerHTML = "";
      array.forEach(({ nombre, precio, descripcion, categoria }) => {
        const producto = document.createElement("article");
        producto.classList.add("card-body");

        producto.innerHTML = `
                <h3 class ="card-title">${nombre}</h3>
                <p class = "card-text">Precio: ${precio}</p>
                <p class = "card-text">${descripcion}</p>
                <p class = "card-text">${categoria}</p>
            `;
        padre.appendChild(producto);
      });
    }
    renderizar(productos);

    botonFiltro.addEventListener("click", () => {
      filtrado(productos);
    });

    function filtradoMayor(array, contenido) {
      const arrayFiltrado = array.filter(({ precio }) => precio > contenido);
      renderizar(arrayFiltrado);
    }

    function filtradoMenor(array, contenido) {
      const arrayFiltrado = array.filter(({ precio }) => precio < contenido);
      renderizar(arrayFiltrado);
    };

    function filtradoPorNombre(array, contenido) {
      const arrayFiltrado = array.filter(({ nombre }) => nombre.toLowerCase().includes(contenido));
      renderizar(arrayFiltrado);
    };

    const barraBusqueda = document.querySelector(".barra");
    const barraNumeros = document.querySelector(".bNumeros");
    const barraMenor = document.querySelector(".bMenor");

    const botonElectronica = document.querySelector('.botonC1');
    const botonAccesorios = document.querySelector('.botonC2');
    const botonHogar = document.querySelector('.botonC3');
    const botonRopa = document.querySelector('.botonC4');

    function filtradoElectronica(array, buscar) {
      const arrayElectronica = array.filter(({ categoria }) => categoria.toLowerCase().includes(buscar.toLowerCase()))
      renderizar(arrayElectronica)
    };

    function filtradoAccesorios(array, buscar) {
      const arrayAccesorios = array.filter(({ categoria }) => categoria.toLowerCase().includes(buscar.toLowerCase()))
      renderizar(arrayAccesorios)
    };

    function filtradoHogar(array, buscar) {
      const arrayHogar = array.filter(({ categoria }) => categoria.toLowerCase().includes(buscar.toLowerCase()))
      renderizar(arrayHogar)
    };

    function filtradoRopa(array, buscar) {
      const arrayRopa = array.filter(({ categoria }) => categoria.toLowerCase().includes(buscar.toLowerCase()))
      renderizar(arrayRopa)
    };

    botonElectronica.addEventListener('click', (e) => {
      filtradoElectronica(productos, e.target.textContent)
    });

    botonAccesorios.addEventListener('click', (e) => {
      filtradoAccesorios(productos, e.target.textContent)
    });

    botonHogar.addEventListener('click', (e) => {
      filtradoHogar(productos, e.target.textContent)
    });

    botonRopa.addEventListener('click', (e) => {
      filtradoRopa(productos, e.target.textContent)
    });




    //   barraBusqueda.addEventListener("input", () => {
    //     const contenido = barraBusqueda.value;
    //     filtrado(productos, contenido);
    //   });

    barraNumeros.addEventListener("input", (e) => {
      filtradoMayor(productos, e.target.value)
    });

    barraMenor.addEventListener('input', (e) => {
      filtradoMenor(productos, e.target.value)
    });

    barraBusqueda.addEventListener('input', (e) => {
      filtradoPorNombre(productos, e.target.value.toLowerCase())
    });



    //explicacion para lo de e, en este caso e.target.value sustituye a contenido, contenido se saca sacando con value el contenido escrito en la barra
    // pues lo que hacemos es que e, es literalmente el evento, en este caso un input, escribit en la barra
    //a ese e le sumamos un target, q es por asi decirlo donde se ejecuta el evento, en este caso la barra de tareas
    //y luego como lo que queremos es el valor de lo q se escribe, lo sacamos con value
    //por lo que contenido.value === e.target.value

    //tarea: esto con 3 imputs: filtro por nombre, filtro por categoria, precio minimo




  </script>
