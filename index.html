<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <h2>Moviles</h2>
    <section class="contenedor-moviles">
        <script>
        const ivaMovil = 1.21;

        const productos = [
            { id: 1, nombre: "Iphone", descripcion: "Este es un movil nuevo de marca Iphone", precio: 29.99, disponible: true, descuento: true },
            { id: 2, nombre: "Iphone 12", descripcion: "Este es un movil nuevo de marca Iphone", precio: 39.99, disponible: true , descuento: false},
            { id: 3, nombre: "Iphone 13", descripcion: "Este es un movil nuevo de marca Iphone", precio: 19.99, disponible: true , descuento: true},
            { id: 4, nombre: "Iphone 14", descripcion: "Este es un movil nuevo de marca Iphone", precio: 79.99, disponible: true , descuento: true},
            { id: 5, nombre: "Iphone 16", descripcion: "Este es un movil nuevo de marca Iphone", precio: 69.99, disponible: false , descuento: false},
            { id: 6, nombre: "Iphone X", descripcion: "Este es un movil nuevo de marca Iphone", precio: 29.99, disponible: false , descuento: false},
            { id: 7, nombre: "Iphone", descripcion: "Este es un movil nuevo de marca Iphone", precio: 49.99, disponible: true , descuento: true}
        ];
        
        const productosConIva = productos.map(movil => ({...movil, precioConIva: (movil.precio*ivaMovil).toFixed(2)}));

        const contenedor = document.querySelector('.contenedor-moviles');

        productosConIva.forEach(({ id, nombre, descripcion, precio, disponible, precioConIva, descuento }) => {
            const tarjeta = document.createElement('article');
            tarjeta.classList.add('tarjeta');

            tarjeta.innerHTML = `
                <h3>${nombre}</h3>
                <p>${descripcion}</p>
                <p>${precio} € / ${precioConIva}</p>
                <div class="button-flex">${disponible ? '<button>Agregar al carro</button>' : '<p>No quedan</p>'}</div>
                ${descuento ? '<div class="descuento">¡Descuento!</div>' : '<div></div>'}
            `;

            contenedor.appendChild(tarjeta);
        });

    </script>
    </section>

</body>

</html>
